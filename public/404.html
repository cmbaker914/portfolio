<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Field Notes</title>
    <!--
      SPA fallback for GitHub Pages. Pages has no server-side routing, so a hard
      refresh on a deep link (e.g. /portfolio/projects) hits this 404 page. We
      encode the requested path into a query string and bounce to the app root,
      where a snippet in index.html restores it. pathSegmentsToKeep = 1 keeps the
      /portfolio/ project-page prefix. See github.com/rafgraph/spa-github-pages.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
